# Triển khai production: Postgres + migrate + app (Next standalone) + Caddy (HTTPS) + cron.
# Dùng: cd deploy && cp .env.prod.example .env && (sửa .env) && docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: { context: .., dockerfile: Dockerfile, target: build }
    command: npx prisma db push --skip-generate
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db: { condition: service_healthy }

  app:
    build: { context: .., dockerfile: Dockerfile }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      INTERNAL_CRON_SECRET: ${INTERNAL_CRON_SECRET}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
    depends_on:
      migrate: { condition: service_completed_successfully }
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  cron:
    image: alpine:3.20
    restart: unless-stopped
    environment:
      INTERNAL_CRON_SECRET: ${INTERNAL_CRON_SECRET}
    volumes:
      - ./cron-entrypoint.sh:/cron-entrypoint.sh:ro
    command: sh /cron-entrypoint.sh
    depends_on:
      - app

volumes:
  db-data:
  caddy-data:
  caddy-config:
